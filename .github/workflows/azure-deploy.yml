name: MLOps CI/CD Pipeline

on:
  push:
    # Se activa en ambas ramas para facilitar pruebas y entrega final
    branches: [ "ajustes_azure", "main", "test-deploy" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Ejecutar Tests con Cobertura >= 70%
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=src --cov-fail-under=70 

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Se despliega si estamos en 'ajustes_azure' o en 'main' tras un push
    if: (github.ref == 'refs/heads/ajustes_azure' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-deploy') && github.event_name == 'push'
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Copiar archivos esenciales al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: adminuser
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          # MEJORA: Solo copiamos lo necesario para que el contenedor funcione.
          # Esto evita subir gigas de historial de .git o carpetas de caché local.
          source: "src/,data/,models/,docker-compose.yml,Dockerfile,requirements.txt"
          target: "/home/adminuser/predictive-maintenance"

      - name: Desplegar Microservicios en Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: adminuser
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /home/adminuser/predictive-maintenance
            # MEJORA: Uso de 'docker compose' (V2) sin guion para mayor compatibilidad
            # con instalaciones modernas de Docker y soporte de condiciones en depends_on.
            sudo docker compose down
            sudo docker compose up --build -d scale worker=3
