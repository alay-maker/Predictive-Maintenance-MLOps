version: '3.8'

services:
  # 1. Base de datos (Imagen oficial de Redis, sin configurar nada a mano)
  redis-db:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    networks:
      - predictive-net

  # 2. Servicio de inicialización (Carga el modelo JSON en Redis y se apaga)
  setup-redis:
    build: .
    container_name: python-setup
    command: python src/setup_redis.py
    depends_on:
      redis-db:
        condition: service_started
    environment:
      - REDIS_HOST=redis-db
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    networks:
      - predictive-net

  # 3. El Productor (Inyecta los datos de los sensores)
  productor:
    build: .
    container_name: python-productor
    command: python src/productor.py
    depends_on:
      setup-redis:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=redis-db
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - predictive-net

  # 4. El Worker (Motor de inferencia)
  worker:
    build: .
    container_name: python-worker
    command: python src/worker.py worker_docker
    depends_on:
      setup-redis:
        condition: service_completed_successfully
    environment:
      - REDIS_HOST=redis-db
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    networks:
      - predictive-net

networks:
  predictive-net:
    driver: bridge
