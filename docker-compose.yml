services:
  # 1. Base de datos con PERSISTENCIA
  redis-db:
    image: redis:7-alpine
    container_name: redis-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # Para no perder los datos si el server se reinicia
    networks:
      - predictive-net
    restart: always

  # 2. Servicio de inicialización
  setup-redis:
    build: .
    container_name: python-setup
    command: python src/setup_redis.py
    depends_on:
      redis-db:
        condition: service_started
    environment:
      - REDIS_HOST=redis-db
    # Añadimos el volumen para leer el modelo modificado (Zero-Downtime)
    volumes:
      - ./models:/app/models
    networks:
      - predictive-net

  # 3. El Productor
  productor:
    build: .
    container_name: python-productor
    command: python src/productor.py
    depends_on:
      redis-db:                        # <-- CAMBIO: Ahora depende solo de la base de datos
        condition: service_started     # <-- CAMBIO
    environment:
      - REDIS_HOST=redis-db
      - PYTHONUNBUFFERED=1
    networks:
      - predictive-net
    restart: on-failure

  # 4. El Worker
  worker:
    build: .
    command: >
      sh -c "python src/worker.py worker_$$(hostname)"
    depends_on:
      redis-db:                        # <-- CAMBIO: Ahora depende solo de la base de datos
        condition: service_started     # <-- CAMBIO
    environment:
      - REDIS_HOST=redis-db
      - PYTHONUNBUFFERED=1
    networks:
      - predictive-net
    restart: on-failure 

networks:
  predictive-net:
    driver: bridge

volumes:
  redis_data: # Definimos el volumen para Redis
